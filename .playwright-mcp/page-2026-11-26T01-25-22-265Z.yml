              - paragraph [ref=e318]: Viewing any part of the bright Sun through a camera lens, binoculars, or a telescope without a special-purpose solar filter secured over the front of the optics will instantly cause severe eye injury.When watching the partial phases of the solar eclipse directly with your eyes, which happens before and after totality, you must look through safe solar viewing glasses (“eclipse glasses”) or a safe handheld solar viewer at all times. You can also use an indirect viewing method, such as a pinhole projector.
