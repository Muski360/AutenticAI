name: autenticai
description: "Cliente Android do AutenticAI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.webp
    - assets/symbol.webp
    - assets/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/Inter.ttf
