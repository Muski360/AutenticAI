<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutenticAI</title>
    <link rel="stylesheet" href="popup.css">
    <script defer src="popup.js"></script>
  </head>
  <body>
    <header class="top">
      <img src="brand.png" alt="AutenticAI">
      <button id="logout" hidden>Sair</button>
    </header>
    <main>
      <p id="status" role="status"></p>
      <p id="error" role="alert"></p>
      <section id="access" class="access" hidden>
        <div class="evidence-plate" aria-hidden="true"><div class="orbit"><img src="symbol.png" alt=""></div></div>
        <h1>Análise da <span>aba</span></h1>
        <button id="login" class="primary">Entrar com Google <span aria-hidden="true">↗</span></button>
      </section>
      <div id="workspace" hidden>
        <section class="panel intake">
          <h1>Nova <span>análise</span></h1>
          <button id="read" class="primary">Ler texto da aba <span aria-hidden="true">↗</span></button>
        </section>
        <section id="preview" class="panel" hidden>
          <h2 tabindex="-1">Revise o texto</h2>
          <pre id="text" tabindex="0"></pre>
          <p>Ao confirmar, o texto será enviado à Groq e à Tavily para análise.</p>
          <div class="actions">
            <button id="cancel">Cancelar</button>
            <button id="submit" class="primary">Confirmar envio <span aria-hidden="true">↗</span></button>
          </div>
        </section>
        <section id="result" class="panel report" hidden>
          <h2 tabindex="-1">Resultado</h2>
          <div id="report"></div>
        </section>
        <section class="panel history">
          <div class="section-heading"><h2 id="history-title" tabindex="-1">Histórico</h2><button id="history">Abrir histórico</button></div>
          <div id="records"></div>
        </section>
      </div>
    </main>
  </body>
</html>
